{% extends "base.html" %}

{% block fullwidth %}

<style>
  html, body {
    margin: 0 !important;
    padding: 0 !important;
  }

  /* ── HERO ── */
  .hero-wrapper {
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    width: 100vw;
    max-width: 100vw;
  }

  .hero {
    width: 100vw;
    height: 100svh;
    min-height: 480px;
    position: relative;
    overflow: hidden;
  }

  .hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* Layered overlay: dark at top (for navbar legibility) + dark at bottom */
  .hero-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(13, 8, 10, 0.55) 0%,
        rgba(13, 8, 10, 0.15) 40%,
        rgba(13, 8, 10, 0.15) 60%,
        rgba(13, 8, 10, 0.65) 100%
      );
  }

  /* Subtle vignette */
  .hero-vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 120px rgba(13, 8, 10, 0.4);
    pointer-events: none;
  }

  /* ── HERO CONTENT ── */
  .hero-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 1.5rem;
    gap: 0;
  }

  .hero-eyebrow {
    font-family: 'Jost', sans-serif;
    font-size: clamp(0.65rem, 1.5vw, 0.78rem);
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(245, 233, 211, 0.85);
    margin-bottom: 1.2rem;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.9s ease 0.4s forwards;
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 9vw, 7.5rem);
    font-weight: 400;
    line-height: 1.0;
    color: #fdf4f7;
    letter-spacing: -0.01em;
    margin: 0 0 0.15em;
    opacity: 0;
    transform: translateY(18px);
    animation: fadeUp 1s ease 0.65s forwards;
  }

  .hero-title .amp {
    font-style: italic;
    color: #f5c4d3;
    font-size: 1.1em;
    display: inline-block;
    transform: rotate(-3deg);
  }

  .hero-divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(184, 145, 58, 0.7), transparent);
    margin: 1.4rem auto 1.3rem;
    opacity: 0;
    animation: fadeIn 0.8s ease 1.1s forwards;
  }

  .hero-sub {
    font-family: 'Jost', sans-serif;
    font-size: clamp(0.9rem, 2vw, 1.05rem);
    font-weight: 300;
    color: rgba(253, 244, 247, 0.8);
    letter-spacing: 0.06em;
    margin-bottom: 2.4rem;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.9s ease 1.2s forwards;
  }

  /* ── COUNTDOWN ── */
  .countdown-wrap {
    display: flex;
    align-items: center;
    gap: 0;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.9s ease 1.45s forwards;
  }

  .countdown-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.75rem 1.1rem;
    background: rgba(13, 8, 10, 0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(245, 214, 223, 0.15);
    min-width: 72px;
  }

  .countdown-unit:first-child { border-radius: 14px 0 0 14px; }
  .countdown-unit:last-child  { border-radius: 0 14px 14px 0; }

  .countdown-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 500;
    color: #fdf4f7;
    line-height: 1;
    letter-spacing: 0.02em;
    transition: opacity 0.2s ease;
    min-width: 2ch;
    text-align: center;
  }

  .countdown-label {
    font-family: 'Jost', sans-serif;
    font-size: 0.58rem;
    font-weight: 400;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(184, 145, 58, 0.85);
    margin-top: 4px;
  }

  .countdown-sep {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    color: rgba(245, 214, 223, 0.35);
    padding: 0 2px;
    align-self: center;
    padding-bottom: 10px;
    background: rgba(13, 8, 10, 0.45);
    border-top: 1px solid rgba(245, 214, 223, 0.15);
    border-bottom: 1px solid rgba(245, 214, 223, 0.15);
    height: 100%;
    display: flex;
    align-items: center;
    line-height: 1;
  }

  .today-message {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    font-style: italic;
    color: #f5c4d3;
    letter-spacing: 0.04em;
    animation: softPulse 2s ease-in-out infinite;
  }

  @keyframes softPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }

  /* ── SCROLL CUE ── */
  .scroll-cue {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0;
    animation: fadeIn 1s ease 2.2s forwards;
  }

  .scroll-line {
    width: 1px;
    height: 36px;
    background: linear-gradient(to bottom, transparent, rgba(245, 214, 223, 0.6));
    animation: scrollPulse 1.8s ease-in-out infinite;
  }

  .scroll-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(245, 214, 223, 0.55);
  }

  @keyframes scrollPulse {
    0%, 100% { opacity: 0.5; transform: scaleY(0.8); }
    50%  { opacity: 1; transform: scaleY(1); }
  }

  /* ── KEYFRAMES ── */
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .countdown-unit {
      min-width: 58px;
      padding: 0.6rem 0.7rem;
    }

    .countdown-sep {
      padding: 0 1px;
      font-size: 1.2rem;
    }
  }
</style>

<div class="hero-wrapper">
  <div class="hero">

    <video autoplay muted loop playsinline preload="auto">
      <source src="/static/video/wedding.mp4" type="video/mp4">
    </video>

    <div class="hero-overlay"></div>
    <div class="hero-vignette"></div>

    <div class="hero-content">

      <p class="hero-eyebrow">Together forever</p>

      <h1 class="hero-title">
        Olivia <span class="amp">&amp;</span> James
      </h1>

      <div class="hero-divider"></div>

      <p class="hero-sub">Join us as we celebrate love and a lifetime together</p>

      <div id="countdown" class="countdown-wrap">
        <!-- Filled by JS -->
      </div>

    </div>

    <div class="scroll-cue">
      <div class="scroll-line"></div>
      <div class="scroll-dot"></div>
    </div>

  </div>
</div>

<script>
  (function () {
    const weddingDate = new Date("{{ wedding_date|date:'Y-m-d' }}T10:00:00").getTime();
    const el = document.getElementById("countdown");

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function renderUnits(days, hours, mins, secs) {
      return `
        <div class="countdown-unit">
          <span class="countdown-num">${pad(days)}</span>
          <span class="countdown-label">Days</span>
        </div>
        <div class="countdown-sep">·</div>
        <div class="countdown-unit">
          <span class="countdown-num">${pad(hours)}</span>
          <span class="countdown-label">Hours</span>
        </div>
        <div class="countdown-sep">·</div>
        <div class="countdown-unit">
          <span class="countdown-num">${pad(mins)}</span>
          <span class="countdown-label">Mins</span>
        </div>
        <div class="countdown-sep">·</div>
        <div class="countdown-unit">
          <span class="countdown-num">${pad(secs)}</span>
          <span class="countdown-label">Secs</span>
        </div>
      `;
    }

    function tick() {
      const diff = weddingDate - Date.now();

      if (diff <= 0) {
        el.innerHTML = `<p class="today-message">💍 Today is the big day!</p>`;
        return;
      }

      const days  = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins  = Math.floor((diff % 3600000) / 60000);
      const secs  = Math.floor((diff % 60000) / 1000);

      // Only re-render the seconds digit to avoid layout flicker
      const secEl = el.querySelector(".countdown-unit:last-child .countdown-num");
      if (secEl) {
        secEl.textContent = pad(secs);
        // Update minutes when it flips
        const minEl = el.querySelectorAll(".countdown-unit")[2]?.querySelector(".countdown-num");
        if (minEl) minEl.textContent = pad(mins);
      } else {
        el.innerHTML = renderUnits(days, hours, mins, secs);
      }
    }

    tick();
    setInterval(tick, 1000);
  })();
</script>

{% endblock %}
