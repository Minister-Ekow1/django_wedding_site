{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Wedding CMS Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        body{
            margin:0;
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
                rgba(0,0,0,0.45),
                rgba(0,0,0,0.45)
            ),
            url("{% static 'images/login-bg.jpg' %}");

            background-size:cover;
            background-position:center;

            font-family:'Poppins',sans-serif;
        }

        .login-card{

            width:100%;
            max-width:430px;

            background:rgba(255,255,255,0.92);

            backdrop-filter:blur(15px);

            border-radius:28px;

            padding:45px;

            box-shadow:0 15px 40px rgba(0,0,0,0.15);
        }

        .logo{
            text-align:center;
            margin-bottom:25px;
        }

        .logo img{
            width:90px;
            height:90px;
            border-radius:50%;
            object-fit:cover;
            margin-bottom:15px;
        }

        .logo h1{
            font-size:34px;
            font-weight:700;
            color:#222;
        }

        .logo p{
            color:#777;
            font-size:14px;
        }

        form input{

            width:100%;

            padding:15px;

            border-radius:14px;

            border:1px solid #ddd;

            margin-bottom:20px;

            transition:0.3s;
        }

        form input:focus{

            outline:none;

            border-color:#d63384;

            box-shadow:0 0 0 4px rgba(214,51,132,0.08);
        }

        .login-btn{

            width:100%;

            background:#d63384;

            color:white;

            border:none;

            padding:15px;

            border-radius:14px;

            font-weight:600;

            transition:0.3s;
        }

        .login-btn:hover{
            background:#bb2d73;
        }

        .error-box{

            background:#f8d7da;

            color:#721c24;

            padding:14px;

            border-radius:12px;

            margin-bottom:20px;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">

        <img src="{% static 'images/logo.png' %}">

        <h1>Wedding CMS</h1>

        <p>
            Secure Admin Access
        </p>

    </div>

    {% if form.errors %}

    <div class="error-box">

        Invalid username or password

    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.username }}

        {{ form.password }}

        <button class="login-btn">

            Login

        </button>

    </form>

</div>

</body>
</html>
