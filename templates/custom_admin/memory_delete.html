{% extends "custom_admin/base_admin.html" %}
{% block content %}

<style>

.delete-wrapper{
    max-width:650px;
    margin:80px auto;
}

.delete-card{
    background:white;
    border-radius:28px;
    padding:50px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.delete-icon{
    font-size:70px;
    margin-bottom:20px;
}

.delete-card h1{
    font-size:36px;
    margin-bottom:15px;
}

.delete-card p{
    color:#666;
    line-height:1.8;
    margin-bottom:35px;
}

.memory-preview{
    background:#faf4f7;
    padding:25px;
    border-radius:18px;
    margin-bottom:30px;
}

.memory-preview img{
    width:100%;
    border-radius:16px;
    margin-bottom:20px;
}

.action-row{
    display:flex;
    justify-content:center;
    gap:15px;
}

.delete-btn{
    background:#dc3545;
    color:white;
    border:none;
    padding:14px 24px;
    border-radius:14px;
}

.cancel-btn{
    background:#6c757d;
    color:white;
    text-decoration:none;
    padding:14px 24px;
    border-radius:14px;
}

</style>

<div class="delete-wrapper">

    <div class="delete-card">

        <div class="delete-icon">
            ⚠️
        </div>

        <h1>Delete Memory</h1>

        <div class="memory-preview">

            {% if memory.image %}

            <img src="{{ memory.image.url }}">

            {% endif %}

            <h4>{{ memory.title }}</h4>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="action-row">

                <button class="delete-btn">
                    Delete Memory
                </button>

                <a href="{% url 'custom_admin:memories_manage' %}"
                   class="cancel-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
