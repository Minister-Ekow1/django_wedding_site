{% extends "custom_admin/base_admin.html" %}
{% block content %}

<style>

.admin-form-wrapper{
    max-width:900px;
    margin:auto;
}

.admin-header{
    margin-bottom:35px;
}

.admin-header h1{
    font-size:42px;
    font-weight:700;
    color:#222;
}

.admin-header p{
    color:#777;
    font-size:15px;
}

.form-card{
    background:white;
    border-radius:24px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.form-card label{
    display:block;
    margin-bottom:8px;
    color:#555;
    font-weight:600;
}

.form-card input,
.form-card textarea{
    width:100%;
    border:1px solid #eee;
    border-radius:14px;
    padding:14px;
    margin-bottom:22px;
    transition:0.3s;
}

.form-card input:focus,
.form-card textarea:focus{
    border-color:#d63384;
    outline:none;
    box-shadow:0 0 0 4px rgba(214,51,132,0.08);
}

.btn-save{
    background:#d63384;
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:14px;
    font-weight:600;
}

.btn-save:hover{
    background:#bb2d73;
}

.quick-actions{
    display:flex;
    gap:15px;
    margin-top:20px;
}

.quick-actions a{
    text-decoration:none;
    background:#faf3f7;
    color:#d63384;
    padding:12px 18px;
    border-radius:12px;
    font-size:14px;
}

</style>

<div class="admin-form-wrapper">

    <div class="admin-header">

        <div class="quick-actions">

            <a href="{% url 'custom_admin:about_images' %}">
                📸 View About Images
            </a>

        </div>

    </div>

    <div class="form-card">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn-save">
                Save Changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
